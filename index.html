<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What's Hot">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>What's Hot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070708;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:#0d0d10;padding-bottom:86px}
header{padding:18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:26px;letter-spacing:-1.5px}.brand span{color:#ff5200}.pill{font-size:11px;background:#25130c;color:#ff7c42;padding:7px 10px;border-radius:20px}
.hero{margin:0 16px 14px;padding:20px;border-radius:22px;background:linear-gradient(135deg,#321407,#121214);border:1px solid #382116}.hero small{color:#ff7c42;font-weight:900}.hero h1{font-size:31px;line-height:1.02;margin:5px 0 8px}.hero p{color:#999;margin:0;font-size:13px}
.section{padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}.head b{font-size:19px}.head span{font-size:11px;color:#777}
.card{display:flex;align-items:center;gap:10px;background:#17171b;border:1px solid #26262b;padding:13px;border-radius:17px;margin-bottom:9px}.rank{color:#666;font-weight:900;width:25px}.info{flex:1}.info b{display:block}.info span{display:block;color:#888;font-size:11px;margin-top:3px}.info em{display:block;color:#ff7440;font-size:11px;font-style:normal;font-weight:800;margin-top:6px}.score{font-size:20px;font-weight:950}.score small{display:block;font-size:8px;color:#777;text-align:center}
.cta{width:100%;border:0;background:#ff5200;color:#fff;padding:14px;border-radius:14px;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;justify-content:space-around;background:#101013f5;border-top:1px solid #29292e;padding:10px 0 14px}.nav button{border:0;background:none;color:#777;font-size:10px}.nav button b{display:block;font-size:19px;color:#fff}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center;z-index:5}.sheet{width:min(480px,100%);background:#18181c;border-radius:25px 25px 0 0;padding:20px}.vote{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vote button{padding:14px;border-radius:13px;border:1px solid #333;background:#222;color:#fff;font-weight:800}.done{width:100%;padding:14px;border:0;border-radius:13px;background:#ff5200;color:#fff;font-weight:900;margin-top:8px}
.error{padding:12px;background:#2a1414;border:1px solid #5b2727;color:#ffb2b2;border-radius:12px;margin-bottom:10px;font-size:12px}.loading{color:#888;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">WHAT'S <span>HOT</span></div><div class="pill">● LIVE BETA</div></header>
<div class="hero"><small>TAMPA BAY</small><h1>Where should we go tonight?</h1><p>Live venue data powered by crowd reports.</p></div>
<div class="section">
<div class="head"><b>🔥 Trending now</b><span id="fresh">CONNECTING…</span></div>
<div id="err"></div><div id="cards"><div class="loading">Loading live venues…</div></div>
<button class="cta" onclick="openTop()">＋ Check in & report the vibe</button>
</div>
<nav class="nav"><button><b>🔥</b>Hot</button><button><b>⌖</b>Map</button><button onclick="openTop()"><b>＋</b>Check In</button><button><b>♡</b>Saved</button><button><b>☻</b>Profile</button></nav>
</div>
<div class="modal" id="modal"><div class="sheet"><h2 id="checkTitle">How's the vibe?</h2><p style="color:#999;font-size:13px">Your report updates the live score for everyone.</p><div class="vote"><button onclick="vote(5,'GOING OFF')">🔥 Going off</button><button onclick="vote(4,'BUSY')">👍 Pretty busy</button><button onclick="vote(2,'CHILL')">😐 Chill</button><button onclick="vote(1,'DEAD')">🥱 Dead</button></div><button class="done" onclick="closeM()">Done</button></div></div>
<script>
const SUPABASE_URL="https://vllqnjteydpxibzsxxvv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_fv2e2n6hjEf4JOv4T9eFNA_RICo7FtZ";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let venues=[],currentVenue=null;
function err(m){document.getElementById('err').innerHTML='<div class="error">'+m+'</div>'}
async function loadVenues(){
 document.getElementById('fresh').textContent='UPDATING…';
 const {data:vs,error:e1}=await sb.from('venues').select('*');
 if(e1){err('Could not load venues: '+e1.message);return}
 const cutoff=new Date(Date.now()-2*60*60*1000).toISOString();
 const {data:cs,error:e2}=await sb.from('check_ins').select('venue_id,crowd_level,vibe,created_at').gte('created_at',cutoff);
 if(e2) err('Crowd reports could not load: '+e2.message);
 const checks=cs||[];
 venues=vs.map(v=>{
   const r=checks.filter(x=>x.venue_id===v.id);
   let adj=0;
   r.forEach(x=>{if(x.crowd_level===5)adj+=3;else if(x.crowd_level===4)adj+=2;else if(x.crowd_level===2)adj-=1;else if(x.crowd_level===1)adj-=3});
   adj=Math.max(-15,Math.min(15,adj));
   const latest=[...r].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
   return {...v,live_score:Math.max(0,Math.min(100,Number(v.hot_score||50)+adj)),live_status:latest?.vibe||v.status||'CHILL'}
 }).sort((a,b)=>b.live_score-a.live_score);
 render();document.getElementById('fresh').textContent='LIVE NOW';
}
function render(){
 document.getElementById('cards').innerHTML=venues.map((v,i)=>`<div class="card" onclick="openM('${v.id}')"><div class="rank">#${i+1}</div><div class="info"><b>${v.name}</b><span>${v.area||''} · ${v.scene||'Nightlife'}</span><em>● ${v.live_status}${v.line_note?' · '+v.line_note:''}</em></div><div class="score">${v.live_score}<small>HOT</small></div></div>`).join('');
}
function openTop(){if(venues.length)openM(venues[0].id)}
function openM(id){currentVenue=venues.find(v=>v.id===id);if(!currentVenue)return;document.getElementById('checkTitle').textContent=currentVenue.name;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
async function vote(level,vibe){
 const {error}=await sb.from('check_ins').insert({venue_id:currentVenue.id,crowd_level:level,vibe});
 if(error){alert('Could not submit report: '+error.message);return}
 closeM();await loadVenues();
}
sb.channel('wh-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'check_ins'},()=>loadVenues()).subscribe();
loadVenues();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
